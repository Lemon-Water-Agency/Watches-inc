<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael Jackson Bags</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 relative min-h-screen">

    <!-- Minimal Floating Header for Cart -->
    <header class="fixed top-0 w-full z-40 p-4 md:p-6 pointer-events-none">
        <div class="max-w-7xl mx-auto flex justify-end">
            <div id="cart-trigger" class="pointer-events-auto cursor-pointer bg-slate-900 text-white px-6 py-3 rounded-full shadow-xl hover:bg-slate-800 hover:scale-105 transition-all flex items-center space-x-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>
                <span class="font-bold border-l border-slate-700 pl-2 ml-2" id="cart-count">0</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-24 pt-20">
        
        <!-- 1. Hero Section -->
        <section class="py-16 md:py-32 text-center flex flex-col items-center justify-center">
            <h1 class="text-5xl md:text-7xl lg:text-8xl font-black text-slate-900 tracking-tighter mb-6 uppercase">
                Michael Jackson <br/> Bags.
            </h1>
            <p class="text-lg md:text-xl text-slate-500 max-w-2xl font-light">
                A curated collection of premium handbags. Unmatched style, minimalist design, and everyday elegance.
            </p>
        </section>

        <!-- 2. Bento Box Product Display -->
        <section>
            <!-- Tailwind CSS Grid: auto-rows sets a baseline height, col-span/row-span creates the bento effect -->
            <div id="bento-grid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6 auto-rows-[250px] md:auto-rows-[300px]">
                <!-- JavaScript will inject the bento cards here -->
            </div>
        </section>

    </main>

    <!-- Checkout Modal (Kept from Phase 3, styled to match new aesthetic) -->
    <div id="checkout-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md relative mx-4">
            <button onclick="closeCheckout()" class="absolute top-6 right-6 text-slate-400 hover:text-slate-900 text-3xl leading-none transition">&times;</button>
            <div class="text-center mb-8">
                <div class="bg-green-500 text-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl font-bold shadow-lg shadow-green-200">M</div>
                <h3 class="text-2xl font-bold text-slate-900 tracking-tight">Lipa na M-Pesa</h3>
                <p class="text-sm text-slate-500 mt-1">Paybill: 123456 | Acc: MJ Bags</p>
                <p class="text-xl font-black text-slate-900 mt-4 bg-slate-50 py-3 rounded-xl border border-slate-100">Total: KES <span id="modal-total">0</span></p>
            </div>
            
            <div id="payment-form">
                <input type="text" id="phone-number" placeholder="e.g. 0712345678" class="w-full bg-slate-50 border border-slate-200 px-5 py-4 rounded-xl mb-4 focus:outline-none focus:ring-2 focus:ring-slate-900 text-lg transition">
                <button onclick="simulateSTKPush()" class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl hover:bg-slate-800 transition shadow-lg hover:shadow-xl text-lg">Send Prompt</button>
            </div>

            <div id="payment-status" class="hidden text-center py-6">
                <!-- Status content injected by JS -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
