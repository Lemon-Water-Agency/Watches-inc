<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watches.inc | Premium Timepieces</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="hero-container">
        <!-- Layer 1: Solid Background Text -->
        <div class="hero-text-wrapper background-text">
            <h1 class="hero-title">Watches.inc</h1>
            <p class="hero-subtitle">A curated collection of premium timepieces. Unmatched style, minimalist design, and everyday elegance.</p>
        </div>

        <!-- Layer 2: 3D Canvas -->
        <div id="canvas-container" class="hero-canvas-wrapper">
            <canvas id="watch-canvas"></canvas>
        </div>

        <!-- Layer 3: Foreground Outline Text (For Legibility) -->
        <div class="hero-text-wrapper foreground-text">
            <h1 class="hero-title outline">Watches.inc</h1>
            <p class="hero-subtitle transparent">A curated collection of premium timepieces. Unmatched style, minimalist design, and everyday elegance.</p>
        </div>
    </section>

    <!-- Three.js Import Map -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="script.js"></script>
</body>
</html>
