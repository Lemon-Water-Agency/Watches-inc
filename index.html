<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watches.inc | Premium Timepieces</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="hero-section dark-theme">
        
        <!-- LAYER 1: Background (Solid Text) -->
        <!-- z-index: 1 pushes it behind the canvas -->
        <div class="hero-text-wrapper background-text" style="z-index: 1;">
            <h1 class="hero-title">WATCHES.INC</h1>
            <p class="hero-subtitle">A curated collection of premium timepieces. Unmatched style, minimalist design, and everyday elegance.</p>
        </div>

        <!-- LAYER 2: 3D Canvas (Middle) -->
        <!-- z-index: 2 sandwiches it between the text layers -->
        <div id="canvas-container" class="fixed-canvas-wrapper" style="z-index: 2;">
            <canvas id="watch-canvas"></canvas>
        </div>

        <!-- LAYER 3: Foreground (Outlined Text) -->
        <!-- z-index: 3 pulls it to the very front -->
        <!-- pointer-events: none ensures you can still click/drag the 3D watch underneath it -->
        <div class="hero-text-wrapper foreground-text" style="z-index: 3; pointer-events: none;">
            
            <!-- Inline styles force the hollow outline effect -->
            <h1 class="hero-title outline" style="color: transparent; -webkit-text-stroke: 2px #fff;">WATCHES.INC</h1>
            
            <!-- Inline style hides the duplicate paragraph to prevent blurry rendering -->
            <p class="hero-subtitle transparent" style="color: transparent;">A curated collection of premium timepieces. Unmatched style, minimalist design, and everyday elegance.</p>
        </div>

    </section>

    <!-- Three.js Import Map -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="script.js"></script>
</body>
</html>
